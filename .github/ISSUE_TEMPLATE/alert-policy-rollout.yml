name: "CWV: Alert policy rollout"
description: "Implement the Slack (or chat) performance alert policy."
title: "Alert policy rollout — <team>"
labels: ["cwv", "alerts"]
body:
  - type: input
    id: team
    attributes:
      label: Team / agency
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Implementation checklist
      options:
        - label: "Create Slack channels (#perf-alerts-critical, #perf-alerts)"
        - label: "Configure monitoring tool routing by severity"
        - label: "Set severity thresholds from the policy template"
        - label: "Configure cooldown periods"
        - label: "Document response procedure in team wiki"
        - label: "Brief the team on the new alert policy"
        - label: "Run a test alert to verify routing"
        - label: "Schedule a 2-week review to adjust thresholds"
  - type: textarea
    id: notes
    attributes:
      label: Notes / open questions
